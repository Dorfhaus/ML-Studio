name: Native Linux release engines
on:
  push:
    branches: [native-release-engines-20261117]
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        engine: [plasma]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified offline native build dependencies
        run: |
          cd packaging/ci-native-deps
          sha256sum --check SHA256SUMS
          prefix="$RUNNER_TEMP/native-prefix"
          mkdir -p "$prefix" "$RUNNER_TEMP/sdl-src"
          for deb in *.deb; do dpkg-deb -x "$deb" "$prefix"; done
          tar -xzf SDL2-2.30.9.tar.gz --strip-components=1 -C "$RUNNER_TEMP/sdl-src"
          echo "$prefix/usr/bin" >> "$GITHUB_PATH"
          {
            echo "CMAKE_PREFIX_PATH=$prefix/usr"
            echo "CMAKE_INCLUDE_PATH=$prefix/usr/include"
            echo "CMAKE_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu"
            echo "C_INCLUDE_PATH=$prefix/usr/include:$prefix/usr/include/x86_64-linux-gnu"
            echo "CPLUS_INCLUDE_PATH=$prefix/usr/include:$prefix/usr/include/x86_64-linux-gnu"
            echo "LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu"
            echo "LD_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu"
            echo "PKG_CONFIG_PATH=$prefix/usr/lib/x86_64-linux-gnu/pkgconfig"
          } >> "$GITHUB_ENV"
      - name: Compile and package Master Assistant
        if: matrix.engine == 'master'
        run: |
          cmake -S plugins/lemon-master-assistant -B build-master -G Ninja -DCMAKE_BUILD_TYPE=Release -DOXYGEN_ENABLE_NATIVE_OPTIMIZATIONS=OFF -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/plugins/lemon-master-assistant/JUCE"
          cmake --build build-master --target oXygen_VST3 --parallel 2
          python3 packaging/bundle-master-engine.py --bundle 'build-master/oXygen_artefacts/Release/VST3/ML Master Assistant.vst3' --os linux --arch x86_64 --output native-engine.zip
      - name: Compile and package ML Plasma
        if: matrix.engine == 'plasma'
        run: |
          mkdir -p ~/.lemon-studio-release
          printf '{"minimum_free_gib": 10}' > ~/.lemon-studio-release/storage.json
          export CI_CMAKE="$(command -v cmake)"
          export CI_SDL="$RUNNER_TEMP/sdl-src"
          cat > "$RUNNER_TEMP/cmake-plasma" <<'SH'
          #!/bin/bash
          if [[ "$1" == -S ]]; then exec "$CI_CMAKE" "$@" "-DFETCHCONTENT_SOURCE_DIR_SDL2=$CI_SDL"; fi
          exec "$CI_CMAKE" "$@"
          SH
          chmod +x "$RUNNER_TEMP/cmake-plasma"
          CMAKE="$RUNNER_TEMP/cmake-plasma" python3 plugins/ml-plasma/build_native.py --output native-engine.zip --build-dir build-plasma --target-os linux --target-arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.engine }}
          path: native-engine.zip
          if-no-files-found: error
