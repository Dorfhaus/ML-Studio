[workspace]
resolver = "2"
members = ["plugins/ml-drums", "plugins/ml-pure-player", "plugins/ml-riser", "plugins/ml-performance-core", "plugins/ml-time-shaper", "plugins/ml-vocal-tune", "plugins/ml-amp", "plugins/ml-utility-core", "plugins/ml-tuner", "plugins/ml-frequency-shift", "plugins/ml-multiband-delay", "plugins/ml-mix-core", "plugins/ml-reference", "plugins/ml-split", "plugins/ml-waveshaper", "plugins/ml-space-core", "plugins/ml-convolver", "plugins/ml-vocoder", "plugins/ml-tools-core", "plugins/ml-de-esser", "plugins/ml-meter", "plugins/ml-pitch-shift", "plugins/ml-phase", "plugins/ml-plasma", "crates/os-collab", "plugins/lemon-hall", "plugins/lemon-tape", "plugins/lemon-wave", "crates/os-model", "crates/os-flp", "crates/os-engine", "crates/os-dsp", "tools/flp-dump", "tools/os-render", "tools/os-play", "tools/bundle-app", "crates/os-native", "tools/os-native-probe", "crates/os-theme", "crates/os-ui", "crates/os-app", "plugins/lemon-sampler", "plugins/lemon-chop", "tools/bundle-plugins", "crates/os-clap", "crates/os-hostlink", "crates/os-plugkit", "plugins/lemon-parametric-eq-2", "crates/os-host", "crates/os-vst3", "crates/os-vst2", "plugins/lemon-3x-osc", "plugins/lemon-limiter", "plugins/lemon-reverb", "plugins/lemon-delay", "plugins/lemon-small-fx", "plugins/lemon-soft-clipper", "plugins/lemon-fast-distortion", "plugins/lemon-balance", "plugins/lemon-stereo-enhancer", "plugins/lemon-transient-processor", "plugins/lemon-chorus", "plugins/lemon-stereo-shaper", "plugins/citrus", "plugins/tesla", "plugins/pulp-filter", "plugins/press", "crates/os-paths", "tools/watermark", "crates/os-smf", "tools/notices"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
os-model = { path = "crates/os-model" }
os-flp = { path = "crates/os-flp" }
os-engine = { path = "crates/os-engine" }
os-dsp = { path = "crates/os-dsp" }
os-hostlink = { path = "crates/os-hostlink" }
os-host = { path = "crates/os-host" }
os-vst3 = { path = "crates/os-vst3" }
os-vst2 = { path = "crates/os-vst2" }
os-paths = { path = "crates/os-paths" }
os-smf = { path = "crates/os-smf" }
thiserror = "2"

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
mp3lame-sys = { path = "vendor/mp3lame-sys" }
# CPAL 0.18.2 with optional Core Audio process taps for macOS 12/13.
cpal = { path = "vendor/cpal" }

# Pinned editor backends with native file-drop support for ML Drums.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }
