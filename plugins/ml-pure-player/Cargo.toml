[package]
name = "ml-pure-player"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "lib"]
[features]
linked = []
[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-fx = { path = "../lemon-small-fx" }
os-plugkit = { path = "../../crates/os-plugkit" }
os-ui = { path = "../../crates/os-ui" }
os-theme = { path = "../../crates/os-theme" }
os-paths = { path = "../../crates/os-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2.12"
rfd = "0.15"
[build-dependencies]
cc = "1"
[dev-dependencies]
os-clap = { path = "../../crates/os-clap" }
os-host = { path = "../../crates/os-host" }
os-engine = { path = "../../crates/os-engine" }
